# Publishes to npm when a v* tag is pushed, through npm trusted publishing (OIDC).
# No npm token is stored anywhere; see docs/releasing.md for the one-time setup.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: extractions/setup-just@v4
      - run: pnpm install --frozen-lockfile
      - run: just check
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: npm is new enough for trusted publishing (11.5.1+)
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            if (!ok) throw new Error(`npm ${process.argv[1]} is older than 11.5.1`)
          ' "$(npm --version)"
      - run: npm publish --access public
